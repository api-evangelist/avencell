name: Avencell
description: 'Avencell develops next‑generation immunotherapies, focusing on powerful, targeted, and safe CAR‑T cell platforms. Their proprietary switchable CAR technology enables precise control of T‑cell activity, improving therapeutic windows and reducing side effects. Avencell aims to overcome limitations of current cell therapies to treat hard‑to‑treat cancers worldwide.'
